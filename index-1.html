<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABF PCB 북 | 반도체 패키지 기판 핸드북</title>
<meta name="description" content="ABF(Ajinomoto Build-up Film) 기판의 구조, 공정, 재료, 응용을 장별로 정리한 웹 핸드북">
<style>
:root{--bg:#faf8f3;--ink:#1d2433;--mute:#667085;--side:#161d2e;--side-ink:#d8deea;--acc:#c98a12;--line:#e3dfd3;--card:#fff;--code:#f1ede0}
@media(prefers-color-scheme:dark){:root{--bg:#10141f;--ink:#e6e9f0;--mute:#98a1b3;--side:#0b0f19;--card:#171d2b;--line:#2a3247;--code:#1d2538;--acc:#e3a42c}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:17px/1.8 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:280px;flex:none;background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;overflow:auto;padding:28px 20px}
nav h1{font-size:20px;margin:0 0 4px;color:#fff;line-height:1.3}
nav p{font-size:13px;margin:0 0 24px;color:#8e98ad}
nav a{display:block;padding:9px 12px;border-radius:6px;color:inherit;text-decoration:none;font-size:15px;line-height:1.4;border-left:3px solid transparent}
nav a:hover{background:#ffffff12}
nav a.on{background:#ffffff1a;border-left-color:var(--acc);color:#fff}
nav small{display:block;color:#8e98ad;font-size:12px}
main{flex:1;min-width:0;padding:56px 24px 80px}
article{max-width:720px;margin:0 auto}
article h2{font-size:34px;line-height:1.3;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 32px;padding-bottom:20px;border-bottom:1px solid var(--line)}
article h3{font-size:21px;margin:36px 0 8px}
article p{margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);padding:14px 18px;margin:20px 0;border-radius:4px}
.box b{display:block;margin-bottom:2px}
table{width:100%;border-collapse:collapse;margin:20px 0;font-size:15px;display:block;overflow-x:auto}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--code);white-space:nowrap}
ol.steps{padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:0 0 18px 48px}
ol.steps li:before{content:counter(s);position:absolute;left:0;top:2px;width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;text-align:center;line-height:32px;font-size:15px}
ol.steps li:not(:last-child):after{content:"";position:absolute;left:15px;top:36px;bottom:2px;width:2px;background:var(--line)}
ol.steps b{display:block}
figure{margin:24px 0}figure svg{width:100%;height:auto;display:block}
figcaption{font-size:14px;color:var(--mute);text-align:center;margin-top:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none;background:var(--card);font-size:15px}
.pager a:hover{border-color:var(--acc)}
.pager small{display:block;color:var(--mute);font-size:12px}
.pager .n{text-align:right}
.menu{display:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(max-width:860px){
 body{display:block}
 nav{position:fixed;inset:0 25% 0 0;width:auto;max-width:300px;z-index:9;transform:translateX(-100%);transition:transform .2s}
 nav.open{transform:none}
 .menu{display:block;position:sticky;top:0;z-index:5;width:100%;padding:12px 16px;border:0;background:var(--side);color:#fff;font:600 15px inherit;text-align:left}
 main{padding:32px 18px 64px}article h2{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<button class="menu" id="menu" aria-expanded="false">☰ 목차</button>
<nav id="toc" aria-label="목차">
 <h1>ABF PCB 북</h1>
 <p>반도체 패키지 기판 핸드북</p>
 <div id="links"></div>
</nav>
<main><article id="view" tabindex="-1"></article></main>

<script>
const fig1=`<figure><svg viewBox="0 0 640 300" role="img" aria-label="ABF 기판 단면 모식도">
<rect x="20" y="20" width="600" height="260" fill="none"/>
<g font-size="14" fill="currentColor">
<rect x="60" y="30" width="520" height="22" fill="#c98a12" opacity=".9"/><text x="70" y="46" fill="#fff">솔더 레지스트 / 표면처리</text>
<rect x="60" y="56" width="520" height="30" fill="#e9c46a"/><text x="70" y="76" fill="#3b2a00">ABF 빌드업층 (에폭시 + 실리카)</text>
<rect x="60" y="90" width="520" height="30" fill="#e9c46a"/><text x="70" y="110" fill="#3b2a00">ABF 빌드업층</text>
<rect x="60" y="124" width="520" height="70" fill="#7a8aa8"/><text x="70" y="164" fill="#fff">코어 (유리섬유 강화 수지)</text>
<rect x="60" y="198" width="520" height="30" fill="#e9c46a"/><text x="70" y="218" fill="#3b2a00">ABF 빌드업층</text>
<rect x="60" y="232" width="520" height="30" fill="#e9c46a"/><text x="70" y="252" fill="#3b2a00">ABF 빌드업층</text>
<g fill="#b4541a"><rect x="300" y="56" width="14" height="64"/><rect x="300" y="198" width="14" height="64"/><rect x="420" y="124" width="14" height="70" rx="3"/></g>
<text x="322" y="92" font-size="12">마이크로비아</text><text x="442" y="164" font-size="12">PTH(관통홀)</text>
</g></svg><figcaption>그림 1. ABF 기판 단면 모식도 (층 수와 비율은 설명용)</figcaption></figure>`;

const ch=[
{t:"ABF란 무엇인가",s:"반도체 패키지 기판의 핵심 절연재",b:`
<p>ABF는 <b>Ajinomoto Build-up Film</b>의 약자입니다. 식품 기업 아지노모토가 개발한 에폭시 기반 절연 필름으로, 기판 위에 한 층씩 쌓아 올리는 빌드업(build-up) 방식에 쓰입니다.</p>
<p>일반 PCB 절연재와 달리 유리섬유 직물이 없고, 에폭시 수지에 실리카 필러를 고르게 분산한 구조입니다. 그래서 표면이 매끄럽고 미세한 회로를 형성하기에 유리합니다.</p>
<div class="box"><b>한 줄 요약</b>ABF 기판은 CPU·GPU·AI 가속기처럼 단자가 많고 신호가 빠른 칩을 얹는 FC-BGA 패키지 기판의 대표 소재 체계입니다.</div>
<h3>왜 주목받는가</h3>
<p>칩의 입출력 단자 수와 속도가 늘수록 기판에는 더 가는 배선과 더 많은 층이 필요합니다. ABF는 이 요구를 만족하는 절연재로 자리 잡았고, 고성능 컴퓨팅 수요와 함께 관심이 커졌습니다.</p>`},
{t:"구조와 층 구성",s:"코어 위에 쌓는 빌드업층",b:`${fig1}
<p>ABF 기판은 가운데 <b>코어</b>와 그 양면에 적층한 <b>빌드업층</b>으로 이루어집니다. 코어는 강성을 담당하고, 빌드업층은 미세 배선을 담당합니다.</p>
<table><tr><th>요소</th><th>역할</th></tr>
<tr><td>코어</td><td>기판의 뼈대. 휨을 억제하고 관통홀(PTH)로 앞뒤를 연결</td></tr>
<tr><td>ABF 빌드업층</td><td>층간 절연과 미세 회로 형성의 바탕</td></tr>
<tr><td>마이크로비아</td><td>레이저로 뚫어 층 사이를 잇는 작은 구멍</td></tr>
<tr><td>솔더 레지스트</td><td>최외층 보호, 솔더 접합부 정의</td></tr></table>
<p>층 구성은 코어 위아래 몇 층씩인지로 표기하며, 예를 들어 "6-2-6"은 코어 한쪽에 6층, 코어 2층, 반대쪽에 6층을 뜻하는 식입니다.</p>`},
{t:"제조 공정",s:"적층 → 비아 → 도금 → 패턴",b:`<p>빌드업 기판은 같은 순서를 층마다 반복합니다. 핵심은 세미애디티브 공법(SAP)으로, 얇은 시드층 위에 필요한 부분만 구리를 키워 미세 회로를 만듭니다.</p>
<ol class="steps">
<li><b>코어 준비</b>내층 회로를 만든 코어를 세정합니다.</li>
<li><b>ABF 진공 적층</b>필름을 열과 압력으로 눌러 붙이고 경화합니다.</li>
<li><b>레이저 비아 가공</b>CO₂ 등 레이저로 층간 연결용 구멍을 냅니다.</li>
<li><b>디스미어</b>구멍 바닥의 수지 잔사를 화학 처리로 제거하고 표면을 적당히 거칩니다.</li>
<li><b>무전해 구리 시드</b>절연 표면에 얇은 구리층을 입힙니다.</li>
<li><b>패턴 형성</b>드라이필름으로 회로 모양을 만들고 전해 구리 도금으로 회로와 비아를 채웁니다.</li>
<li><b>시드 에칭</b>레지스트와 불필요한 시드층을 제거하면 한 층이 완성됩니다.</li>
<li><b>반복 후 마감</b>필요한 층 수만큼 반복하고 솔더 레지스트와 표면처리를 합니다.</li></ol>`},
{t:"재료 특성",s:"열팽창, 유전 특성, 표면 거칠기",b:`<p>ABF의 성능은 몇 가지 물성의 균형으로 결정됩니다.</p>
<table><tr><th>특성</th><th>의미</th><th>ABF의 방향성</th></tr>
<tr><td>열팽창계수(CTE)</td><td>온도 변화 시 팽창 정도. 실리콘 칩과 차이가 크면 접합부에 응력이 쌓임</td><td>실리카 함량을 높여 낮춤</td></tr>
<tr><td>유전율(Dk)·손실(Df)</td><td>고속 신호의 지연과 손실</td><td>저유전 수지 설계로 개선</td></tr>
<tr><td>표면 거칠기</td><td>미세 회로 형성과 밀착력의 균형</td><td>매끄러운 면에서도 밀착되도록 설계</td></tr>
<tr><td>유리전이온도(Tg)</td><td>수지가 무르게 변하는 온도</td><td>공정·신뢰성 온도보다 높게 설계</td></tr></table>
<div class="box"><b>참고</b>정확한 수치는 제품 등급과 제조사마다 다르므로 실제 설계에는 해당 데이터시트를 확인해야 합니다.</div>`},
{t:"응용 분야",s:"FC-BGA와 고성능 칩",b:`<p>ABF 기판의 가장 큰 용도는 <b>FC-BGA</b>(Flip Chip Ball Grid Array) 패키지입니다. 칩을 뒤집어 범프로 기판에 직접 붙이고, 기판 반대편의 솔더볼로 메인보드와 연결합니다.</p>
<table><tr><th>분야</th><th>예시</th></tr>
<tr><td>PC·서버</td><td>CPU, 서버용 프로세서</td></tr>
<tr><td>그래픽·AI</td><td>GPU, AI 가속기</td></tr>
<tr><td>네트워크</td><td>스위치·라우터용 고속 ASIC</td></tr></table>
<p>칩렛(chiplet)과 2.5D 패키징이 늘면서 기판은 더 크고 층이 많아지는 추세입니다. 이는 수율과 휨 제어의 난도를 높입니다.</p>`},
{t:"불량과 신뢰성",s:"자주 만나는 문제와 대응",b:`<table><tr><th>문제</th><th>원인 예</th><th>대응 방향</th></tr>
<tr><td>휨(Warpage)</td><td>층 간 CTE 불균형, 대면적화</td><td>구조 대칭 설계, 저CTE 재료</td></tr>
<tr><td>비아 불량</td><td>디스미어 부족, 도금 보이드</td><td>공정 조건 관리, 단면 검사</td></tr>
<tr><td>층간 박리</td><td>밀착력 부족, 수분 흡습</td><td>표면 조도·세정 최적화, 건조 관리</td></tr>
<tr><td>회로 단락·개방</td><td>이물, 에칭 편차</td><td>클린룸 관리, AOI 검사</td></tr></table>
<p>신뢰성은 보통 열사이클, 고온고습, 리플로우 내성 시험으로 확인합니다.</p>`},
{t:"용어집",s:"자주 쓰는 약어",b:`<table><tr><th>용어</th><th>설명</th></tr>
<tr><td>ABF</td><td>Ajinomoto Build-up Film</td></tr>
<tr><td>FC-BGA</td><td>플립칩 볼그리드어레이 패키지</td></tr>
<tr><td>SAP / mSAP</td><td>(수정) 세미애디티브 공법</td></tr>
<tr><td>L/S</td><td>Line/Space, 선폭과 선간격</td></tr>
<tr><td>PTH</td><td>Plated Through Hole, 도금 관통홀</td></tr>
<tr><td>AOI</td><td>자동 광학 검사</td></tr>
<tr><td>CTE</td><td>열팽창계수</td></tr></table>
<p class="sub" style="border:0">이 페이지는 학습용 요약입니다. 수치와 사양은 공식 자료로 확인하세요.</p>`}
];

const links=document.getElementById('links'),view=document.getElementById('view'),toc=document.getElementById('toc'),menu=document.getElementById('menu');
links.innerHTML=ch.map((c,i)=>`<a href="#${i+1}" data-i="${i}">${i+1}장. ${c.t}<small>${c.s}</small></a>`).join('');
function render(){
 let i=parseInt(location.hash.slice(1),10)-1;if(!(i>=0&&i<ch.length))i=0;
 const c=ch[i],p=ch[i-1],n=ch[i+1];
 view.innerHTML=`<h2>${i+1}장. ${c.t}</h2><p class="sub">${c.s}</p>${c.b}
 <div class="pager">${p?`<a href="#${i}"><small>이전</small>${p.t}</a>`:'<span></span>'}${n?`<a class="n" href="#${i+2}"><small>다음</small>${n.t}</a>`:'<span></span>'}</div>`;
 links.querySelectorAll('a').forEach(a=>a.classList.toggle('on',+a.dataset.i===i));
 document.title=`${c.t} | ABF PCB 북`;
 toc.classList.remove('open');menu.setAttribute('aria-expanded','false');
 window.scrollTo(0,0);view.focus({preventScroll:true});
}
menu.onclick=()=>{const o=toc.classList.toggle('open');menu.setAttribute('aria-expanded',o)};
addEventListener('hashchange',render);render();
</script>
</body>
</html>
